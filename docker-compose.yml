services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zabekame
      POSTGRES_USER: zabekame
      POSTGRES_PASSWORD: zabekame
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zabekame -d zabekame']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
